name: Execute, verify and publish notebook
on:
  push:
    branches: [main]
    paths:
      - 'MouseLab_Complete_81_Colab.ipynb'
      - 'ci/**'
      - '.github/workflows/notebook-release.yml'
  pull_request:
    paths:
      - 'MouseLab_Complete_81_Colab.ipynb'
      - 'ci/**'
      - '.github/workflows/notebook-release.yml'
  workflow_dispatch:
    inputs:
      exercise_failure_gate:
        description: 'Deliberately fail execution to verify that the live release stays unchanged'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: notebook-${{ github.ref }}
  cancel-in-progress: true
jobs:
  execute:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ci/requirements.txt
      - run: python -m pip install -r ci/requirements.txt
      - name: Test rejection of invalid saved outputs
        run: python ci/test_contract.py
      - name: Execute all cells and inspect outputs
        env:
          EXERCISE_FAILURE_GATE: ${{ inputs.exercise_failure_gate }}
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
        run: python ci/validate_notebook.py
      - name: Save execution evidence, including failed notebooks
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: notebook-execution
          path: release/
          if-no-files-found: warn
          retention-days: 30
  publish:
    needs: execute
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install nbformat==5.11.1 pillow==13.0.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: notebook-execution
          path: release
      - name: Recheck artifact without executing notebook, then promote
        env:
          GH_TOKEN: ${{ github.token }}
        run: python ci/publish.py
